name: Nightly MotionKeys

permissions:
  contents: read

on:
  schedule:
    # 07:00 utc, late night in the americas
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

jobs:
  # nothing is built or released when main hasn't moved since the last nightly, manual runs always build
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      changed: ${{ steps.check.outputs.changed }}
      previous: ${{ steps.check.outputs.previous }}
      tested: ${{ steps.check.outputs.tested }}
    steps:
      - name: Compare with last nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # gh prints the error body to stdout when there's no nightly tag yet, so keep only a real sha
          PREVIOUS=$(gh api repos/${{ github.repository }}/commits/nightly --jq .sha 2>/dev/null | grep -xE '[0-9a-f]{40}' || true)
          echo "previous=$PREVIOUS" >> $GITHUB_OUTPUT
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$PREVIOUS" != "${{ github.sha }}" ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi
          # the push already passed the tests on this exact commit, a push still running doesn't count
          if gh api "repos/${{ github.repository }}/actions/workflows/test.yml/runs?head_sha=${{ github.sha }}&event=push&status=success" --jq .total_count 2>/dev/null | grep -qxE '[1-9][0-9]*'; then
            echo "tested=true" >> $GITHUB_OUTPUT
          else
            echo "tested=false" >> $GITHUB_OUTPUT
          fi

  # on nights without changes test and build only restore their rust caches, so a quiet week doesn't let github evict them
  test:
    needs: check
    if: needs.check.outputs.changed == 'false' || needs.check.outputs.tested != 'true'
    uses: ./.github/workflows/test.yml
    with:
      keepalive: ${{ needs.check.outputs.changed == 'false' }}

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      keepalive: ${{ needs.check.outputs.changed == 'false' }}

  addon:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/package-addon.yml

  # test is skipped when the push already passed it
  release:
    needs: [check, test, build, addon]
    if: ${{ !cancelled() && needs.check.outputs.changed == 'true' && needs.build.result == 'success' && needs.addon.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.test.result) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # short commit hash goes in every release file name so downloads can be traced back to a commit
      - name: Get commit hash
        run: echo "HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # MotionKeys-<ref>-* so the MotionKeys-Bridge-* add-on artifact isn't mixed into the bundles
      - name: Download app bundles
        uses: actions/download-artifact@v7
        with:
          pattern: MotionKeys-${{ github.ref_name }}-*
          path: bundles
          merge-multiple: true

      - name: Download add-on
        uses: actions/download-artifact@v7
        with:
          pattern: MotionKeys-Bridge-*
          path: addon
          merge-multiple: true

      # bundles get the hash before their extension, e.g. MotionKeys_0.5.0_universal-abc1234.dmg
      - name: Name release files
        run: |
          mkdir release
          for f in bundles/*/*; do
            base=$(basename "$f")
            mv "$f" "release/${base%.*}-$HASH.${base##*.}"
          done

      # zip with motionkeys_bridge/ at its root so blender can install it directly
      - name: Zip add-on
        run: cd addon && zip -r ../release/MotionKeys-Bridge-nightly-$HASH.zip motionkeys_bridge

      # commits since the last nightly, or just this commit if the old one is gone
      - name: Write release notes
        env:
          PREVIOUS: ${{ needs.check.outputs.previous }}
        run: |
          echo "Nightly build of \`$HASH\` from $(date -u +%Y-%m-%d)." > notes.md
          echo "" >> notes.md
          if [ -n "$PREVIOUS" ] && git cat-file -e "$PREVIOUS^{commit}" 2>/dev/null; then
            git log --format='- %h %s' "$PREVIOUS..HEAD" >> notes.md
          else
            git log -1 --format='- %h %s' >> notes.md
          fi

      # the nightly release and tag are replaced each time so the tag always points at the latest build
      - name: Publish nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --target ${{ github.sha }} \
            --title "MotionKeys Nightly $(date -u +%Y-%m-%d)" \
            --notes-file notes.md \
            --prerelease \
            --latest=false \
            release/*
