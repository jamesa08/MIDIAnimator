name: Package MotionKeys Blender add-on

permissions:
  contents: read

on:
  push:
    tags: ["*"]
  workflow_dispatch:
  workflow_call:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      # short commit hash goes in the artifact name so builds can be traced back to a commit
      - name: Get commit hash
        shell: bash
        run: echo "HASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # the add-on folder is renamed to the extension id, a valid python module name blender installs the zip as
      - name: Stage add-on
        run: |
          mkdir -p artifacts/motionkeys_bridge
          cp -a rust-impl/blender-addon/. artifacts/motionkeys_bridge/
          find artifacts -name "__pycache__" -type d -prune -exec rm -rf {} +
          find artifacts -name ".DS_Store" -delete

      # the hash goes in the name blender shows (manifest for 4.2+, bl_info for older), fails if either isn't found
      - name: Stamp commit hash
        run: |
          cd artifacts/motionkeys_bridge
          sed -i "s/^name = \"MotionKeys Bridge\"$/name = \"MotionKeys Bridge ($HASH)\"/" blender_manifest.toml
          sed -i "s/\"name\": \"MotionKeys Bridge\",$/\"name\": \"MotionKeys Bridge ($HASH)\",/" __init__.py
          grep -q "^name = \"MotionKeys Bridge ($HASH)\"$" blender_manifest.toml
          grep -q "\"name\": \"MotionKeys Bridge ($HASH)\"," __init__.py

      # the artifact download is a zip with motionkeys_bridge/ at its root, installable directly in blender
      - name: Upload add-on
        uses: actions/upload-artifact@v6
        with:
          name: MotionKeys-Bridge-${{ github.ref_name }}-${{ env.HASH }}
          path: artifacts/
          if-no-files-found: error
