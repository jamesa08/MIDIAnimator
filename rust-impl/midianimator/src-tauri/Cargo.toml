[package]
name = "MIDIAnimator"
version = "0.5.0"
description = "Procedurally animate a MIDI file. version beta5"
authors = ["you"]
license = "GPL-3.0"
repository = "https://github.com/jamesa08/MIDIAnimator"
default-run = "MIDIAnimator"
edition = "2021"
rust-version = "1.60"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2", features = [] }
regex = "*"
walkdir = "2.3"

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2", features = [
    "macos-private-api",
] }
regex = "1.5.4"
lazy_static = "1.4.0"
midly = "0.5.3"
uuid = { version = "1", features = ["v4"] }
once_cell = "1.19.0"
chrono = "0.4"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "sync"] }
async-recursion = "1.1.1"
node_registry = { path = "./node_registry" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-macos-fps = { git = "https://github.com/userFRM/tauri-plugin-macos-fps" }
rmcp = { version = "3.4", features = ["server", "macros", "transport-streamable-http-server"] }
axum = "0.8"
base64 = "0.22"
schemars = "1"
clipboard-rs = { version = "0.3", default-features = false }

# window screenshots, linux uses the webview's own snapshot instead (xcap needs pipewire there)
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
xcap = "0.9"

[target.'cfg(unix)'.dependencies]
# capturing stdout and stderr into the log file (utils/log.rs)
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0"
cairo-rs = { version = "0.18", features = ["png"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.2", features = ["NSWindow", "NSResponder", "NSApplication", "NSColor", "NSScreen", "NSEvent"] }
objc2-foundation = { version = "0.2", features = ["NSNotification", "NSString", "NSOperation", "NSGeometry", "NSArray", "NSEnumerator", "NSThread", "block2"] }
objc2 = "0.5"
block2 = "0.5"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem and the built-in dev server is disabled.
# If you use cargo directly instead of tauri's cli you can use this feature flag to switch between tauri's `dev` and `build` modes.
# DO NOT REMOVE!!
custom-protocol = [ "tauri/custom-protocol" ]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-fuse-ld=/opt/homebrew/bin/ld64.lld"]

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = "2"
